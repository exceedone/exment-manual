<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Exment Manual</title>
  <link rel="icon" href="img/common/favicon-32.png" sizes="32x32">
  <link rel="icon" href="img/common/exment_mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/common/apple-touch-icon.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Exment Manual Page">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/docsify/4.9.4/themes/vue.css">
  <link rel="stylesheet" href="//use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/docsify-toc@1.0.0/dist/toc.css">
  <link rel="stylesheet" href="./bootstrap-grid.min.css">
  <link rel="stylesheet" href="./docs.css">

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-129266700-3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'UA-129266700-3');
  </script>
</head>

<body>
  <nav>
    <a class="exm-site-link" href="https://exment.net/">← exment.net</a>
    <a href="#/">EN</a>
    <a href="#/ja/">日本語</a>
    <a href="#/vi/">Tiếng Việt</a>
  </nav>
  <div id="app">Please wait...</div>
  <script>
    window.$docsify = {
      name: 'Exment',
      //homepage: 'en/README.md',
      homepage: 'README.md',
      repo: 'https://github.com/exceedone/exment.git',
      loadSidebar: true,
      auto2top: true,
      noEmoji: true,
      executeScript: true,
      subMaxLevel: 2,
      nameLink: {
        '/ja': '#/ja/',
        '/vi': '#/vi/',
        '/': ''
      },
      search: {
        noData: {
          '/ja/': '結果がありませんでした',
          '/vi/': 'Không có kết quả!',
          '/en/': 'No results!',
          '/': 'No results!'
        },
        paths: 'auto',
        placeholder: {
          '/ja/': '検索',
          '/vi/': 'Tìm kiếm',
          '/en/': 'Search',
          '/': 'Search'
        }
      },

      toc: {
        scope: '.markdown-section',
        headings: 'h1, h2, h3',
      },

      // the link back to exment.net follows the language of the page
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var hash = window.location.hash || '';
            var site = { ja: ['https://exment.net/', 'exment.net のトップへ'], vi: ['https://exment.net/vi/', 'Về trang chủ exment.net'], en: ['https://exment.net/en/', 'Back to exment.net'] };
            var lang = hash.indexOf('#/ja') === 0 ? 'ja' : (hash.indexOf('#/vi') === 0 ? 'vi' : 'en');
            var links = document.querySelectorAll('a.exm-site-link');
            for (var i = 0; i < links.length; i++) {
              links[i].href = site[lang][0];
              links[i].setAttribute('title', site[lang][1]);
              links[i].setAttribute('target', '_self');
            }
          });
        }
      ],

      requestHeaders: {
        'cache-control': 'no-cache',
        'Pragma': 'no-cache',
        'If-Modified-Since': 'Thu, 01 Jun 1970 00:00:00 GMT',
      },
    };
  </script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/docsify/4.9.4/docsify.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/docsify/4.9.4/plugins/search.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/docsify/4.9.4/plugins/zoom-image.min.js"></script>
  <script src="//unpkg.com/docsify-toc@1.0.0/dist/toc.js"></script>
</body>

</html>
